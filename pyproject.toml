[project]
name = "xarray-hyperspectral"
version = "1.0.0"
description = "Xarray backend for reading hyperspectral remote sensing data cubes."
authors = [{name = "Geert Barentsen", email = "geert@planet.com"}]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "xarray >= 2023.01",
    "h5py >= 3.0",
    "numpy >= 1.24",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
    "dask[array]>=2024.1.0",  # Enable tests to verify dask support
]
docs = [
    "mkdocs>=1.5.0,<2",
    "mkdocs-material>=9.0.0",
    "ipykernel>=6.0",
    "notebook>=7.0",
    "dask[array]>=2024.1.0",
    "fsspec>=2023.1.0",
    "aiohttp>=3.9",
    "matplotlib>=3.7",
    "hvplot>=0.9",
    "jupyter_bokeh>=4.0",
    "rioxarray>=0.15",
    "mkdocs-jupyter>=0.25.0",
]

[project.entry-points."xarray.backends"]
tanager = "xarray_hyperspectral.tanager._backend:TanagerBackendEntrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools >= 64"]
build-backend = "setuptools.build_meta"
